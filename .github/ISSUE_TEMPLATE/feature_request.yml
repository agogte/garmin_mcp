name: Feature request
description: Suggest a new tool or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the question you'd ask your assistant or the workout you'd want to build.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
